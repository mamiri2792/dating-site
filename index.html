<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PairUp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    #signupBtn {
      background: #111;
      color: white;
    }

    #loginBtn {
      background: #eeeeee;
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">❤️ PairUp</div>

    <div class="tagline">
      Meet someone worth knowing.
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <button id="signupBtn">
      Join PairUp
    </button>

    <button id="loginBtn">
      Log In
    </button>

    <div id="message"></div>

  </main>

  <script type="module">

    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");

    const message = document.getElementById("message");


    function showMessage(text) {
      message.textContent = text;
    }


    signupBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      signupBtn.disabled = true;
      showMessage("Creating your PairUp account...");

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage("❤️ Your PairUp account was created!");

      } catch (error) {

        console.error(error);

        if (error.code === "auth/email-already-in-use") {
          showMessage("That email already has a PairUp account. Try logging in.");
        } 
        else if (error.code === "auth/weak-password") {
          showMessage("Your password must be at least 6 characters.");
        } 
        else if (error.code === "auth/invalid-email") {
          showMessage("Please enter a valid email address.");
        } 
        else {
          showMessage("Unable to create your account. Please try again.");
        }

      } finally {

        signupBtn.disabled = false;

      }

    });


    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginBtn.disabled = true;
      showMessage("Logging you into PairUp...");

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage("❤️ Welcome back to PairUp!");

      } catch (error) {

        console.error(error);

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          showMessage("Email or password is incorrect.");
        } 
        else {
          showMessage("Unable to log in. Please try again.");
        }

      } finally {

        loginBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
