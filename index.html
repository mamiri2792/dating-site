<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PairUp</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
    }

    .tagline {
      color: #666;
      margin: 10px 0 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 6px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    #signupBtn {
      background: #111;
      color: white;
    }

    #loginBtn {
      background: #eee;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">❤️ PairUp</div>

    <div class="tagline">
      Meet someone worth knowing.
    </div>

    <input id="email" type="email" placeholder="Email address">

    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn">Join PairUp</button>

    <button id="loginBtn">Log In</button>

    <div id="message">Connecting to PairUp...</div>

  </div>

  <script type="module">

    const message = document.getElementById("message");

    function show(text) {
      message.textContent = text;
    }

    try {

      const firebaseModule = await import("./firebase.js");

      const auth = firebaseModule.auth;

      if (!auth) {
        throw new Error("Firebase Auth was not exported from firebase.js");
      }

      const {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword
      } = await import(
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
      );

      show("PairUp is connected. Ready to create your account.");

      document.getElementById("signupBtn").onclick = async () => {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          show("Enter your email and password first.");
          return;
        }

        show("Creating your PairUp account...");

        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          show("❤️ Account created successfully!");

        } catch (error) {

          console.error(error);

          show(
            "Firebase: " +
            (error.code || error.message)
          );

        }
      };


      document.getElementById("loginBtn").onclick = async () => {

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          show("Enter your email and password first.");
          return;
        }

        show("Logging in...");

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          show("❤️ Welcome back to PairUp!");

        } catch (error) {

          console.error(error);

          show(
            "Firebase: " +
            (error.code || error.message)
          );

        }
      };

    } catch (error) {

      console.error(error);

      show(
        "Connection problem: " +
        error.message
      );

    }

  </script>

</body>
</html>
