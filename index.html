<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PairUp — Meet Someone Worth Knowing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 34px 26px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .tagline {
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #signupBtn {
      background: #111;
      color: #fff;
    }

    #loginBtn {
      background: #eee;
      color: #111;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">❤️ PairUp</div>

    <div class="tagline">
      Meet someone worth knowing.
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <button id="signupBtn">
      Join PairUp
    </button>

    <button id="loginBtn">
      Log In
    </button>

    <div id="status">
      Connecting to PairUp...
    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // PairUp Firebase configuration

    const firebaseConfig = {

      apiKey: "AIzaSyBtWNtQOds1m_wwz3J5sOYSe5KtXujpwLs",

      authDomain:
        "dating-site-6f3a9.firebaseapp.com",

      projectId:
        "dating-site-6f3a9",

      storageBucket:
        "dating-site-6f3a9.firebasestorage.app",

      messagingSenderId:
        "822201581440",

      appId:
        "1:822201581440:web:9fff8f196c2e1dffb54b65",

      measurementId:
        "G-WTCQB1LGNP"
    };


    let auth;

    const status =
      document.getElementById("status");

    const signupBtn =
      document.getElementById("signupBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");


    // Connect to Firebase

    try {

      const app =
        initializeApp(firebaseConfig);

      auth = getAuth(app);

      status.textContent =
        "Firebase connected. PairUp is ready.";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Firebase connection error: " + error.code;

    }


    // CREATE ACCOUNT

    signupBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!auth) {
        status.textContent =
          "Firebase is not connected.";
        return;
      }


      if (!email) {
        status.textContent =
          "Please enter your email.";
        return;
      }


      if (!password) {
        status.textContent =
          "Please enter a password.";
        return;
      }


      if (password.length < 6) {
        status.textContent =
          "Password must be at least 6 characters.";
        return;
      }


      signupBtn.disabled = true;

      status.textContent =
        "Creating your PairUp account...";


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        console.log(
          "Account created:",
          userCredential.user.uid
        );


        status.textContent =
          "❤️ Account created! Welcome to PairUp.";


      } catch (error) {

        console.error(error);


        switch (error.code) {

          case "auth/email-already-in-use":
            status.textContent =
              "That email already has an account. Try logging in.";
            break;

          case "auth/invalid-email":
            status.textContent =
              "Please enter a valid email address.";
            break;

          case "auth/weak-password":
            status.textContent =
              "Please choose a stronger password.";
            break;

          case "auth/operation-not-allowed":
            status.textContent =
              "Email/password sign-in is not enabled in Firebase.";
            break;

          case "auth/invalid-api-key":
            status.textContent =
              "Firebase rejected the API key. Check the Firebase project configuration.";
            break;

          default:
            status.textContent =
              "Account creation failed: " + error.code;
        }

      } finally {

        signupBtn.disabled = false;

      }

    });


    // LOG IN

    loginBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!auth) {
        status.textContent =
          "Firebase is not connected.";
        return;
      }


      if (!email || !password) {
        status.textContent =
          "Enter your email and password.";
        return;
      }


      loginBtn.disabled = true;

      status.textContent =
        "Logging you into PairUp...";


      try {

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        console.log(
          "Logged in:",
          userCredential.user.uid
        );


        status.textContent =
          "❤️ Welcome back to PairUp!";


      } catch (error) {

        console.error(error);


        switch (error.code) {

          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":
            status.textContent =
              "Email or password is incorrect.";
            break;

          case "auth/invalid-api-key":
            status.textContent =
              "Firebase rejected the API key.";
            break;

          default:
            status.textContent =
              "Login failed: " + error.code;
        }

      } finally {

        loginBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
